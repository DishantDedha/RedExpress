# Red Express — the catch-all that answers nothing.
#
# ## The hole this closes
#
# Anyone in the world can point their own domain at this machine's IP address. No credentials
# are involved and nothing stops them: DNS is a public system and an A record is one line in a
# zone they control. Requests then arrive here carrying `Host: whatever-they-registered.com`.
#
# nginx, given a Host it does not recognise, serves the FIRST server block it loaded. Without
# this file that is the API — or worse, the CRM sign-in page — served under a stranger's
# domain, which is a ready-made phishing page wearing your application.
#
# `return 444` is an nginx-specific non-response: the connection is closed with no status line
# and no body. A scanner learns nothing, and there is no page to screenshot.
#
# ## Why this does not break certbot
#
# The ACME challenge arrives as `Host: api.<domain>` and matches the real server block, not
# this one. Renewals keep working, which is also why port 80 must stay open — see README.
#
# ## Install AFTER certbot
#
# The 443 listener needs a certificate to exist before nginx will start, so this file is
# installed once certbot has issued one. Substitute the same API_HOST used there.
#
#   sudo cp deploy/nginx/default-server.conf /etc/nginx/sites-available/default-server
#   sudo sed -i 's/API_HOST/api.example.in/' /etc/nginx/sites-available/default-server
#   sudo ln -sf /etc/nginx/sites-available/default-server /etc/nginx/sites-enabled/000-default-server
#   sudo nginx -t && sudo systemctl reload nginx
#
# The 000- prefix is not cosmetic: sites-enabled loads alphabetically, and default_server must
# be parsed before the real hosts for nginx to accept it as the default for these ports.

server {
    listen 80  default_server;
    listen [::]:80  default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # Any valid certificate satisfies nginx here. It will not match the hostname the attacker
    # asked for, which is exactly right — a browser refuses before anything is served, and the
    # connection is dropped regardless.
    ssl_certificate     /etc/letsencrypt/live/API_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/API_HOST/privkey.pem;

    return 444;
}
