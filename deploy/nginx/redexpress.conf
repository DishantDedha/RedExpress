# Red Express — nginx front door.
#
# Two hostnames, one machine. nginx terminates TLS and hands each request to whichever local
# process owns that hostname; neither process is reachable from outside.
#
#   api.<domain>  ->  127.0.0.1:4000   Express API
#   crm.<domain>  ->  127.0.0.1:3000   Next.js CRM
#
# Two subdomains rather than one host with /api/* routed to the backend, because the CRM
# serves its OWN /api/auth/login and /api/auth/logout route handlers — the ones that set the
# staff session cookies. Path-based routing would shadow them and break staff sign-in.
#
# Install:
#   sudo cp deploy/nginx/redexpress.conf /etc/nginx/sites-available/redexpress
#   sudo ln -sf /etc/nginx/sites-available/redexpress /etc/nginx/sites-enabled/redexpress
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo sed -i 's/API_HOST/api.example.in/; s/CRM_HOST/crm.example.in/' \
#            /etc/nginx/sites-available/redexpress
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only on purpose. `certbot --nginx` rewrites it in place to add the TLS
# directives and the 80 -> 443 redirect, which is why the server_name lines must be correct
# and loaded BEFORE certbot runs — certbot edits blocks it can find, it cannot invent them.

# ---------------------------------------------------------------------------
# Shared proxy behaviour
# ---------------------------------------------------------------------------
# X-Forwarded-For is what the backend's rate limiters key on: TRUST_PROXY=1 tells Express to
# read the client address from this header instead of the socket, which behind nginx is always
# 127.0.0.1. Omit it and every caller in the country shares one rate-limit bucket.
#
# X-Forwarded-Proto matters independently. Without it Next.js believes the request arrived over
# http, and the CRM's Secure session cookies misbehave in ways that look like a login bug.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 60s;

server {
    listen 80;
    listen [::]:80;
    server_name API_HOST;

    # Profile photos are capped at 2 MB by multer (MAX_UPLOAD_BYTES). nginx's own default is
    # 1 MB, so without this every upload over 1 MB dies at the proxy with a bare 413 that never
    # reaches the API's own error envelope.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4000;
    }

    # Liveness and readiness are unauthenticated by design (a probe cannot hold a token) and
    # return nothing identifying. Kept out of the access log so they do not bury real traffic.
    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name CRM_HOST;

    # The CRM accepts no file uploads; its Server Actions are capped at 64kb in next.config.mjs.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
